<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen フォトエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: menubar + options bar on top, tool rail left, canvas stage center, panels right, status bar bottom */
  --bg:#15171b;
  --surface:#1f2228;
  --surface-2:#2a2e36;
  --line:#353a44;
  --text:#dfe3ea;
  --muted:#8c94a2;
  --accent:#4c9bff;
  --accent-ink:#06162b;
  --stage:#101216;
  --font-ui:"IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --font-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font:13px/1.45 var(--font-ui);
  display:grid;grid-template-columns:48px minmax(0,1fr) 276px;grid-template-rows:36px 44px minmax(0,1fr) 26px;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* menubar */
#menubar{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.06em;padding:0 12px 0 4px;flex:none}
.brand b{width:14px;height:14px;border-radius:4px;background:conic-gradient(from 210deg,#ffd27a,#f4a259,#c0607a,#4b3b78,#4c9bff,#ffd27a)}
.menu{flex:none}
.menu-btn{background:none;border:0;padding:5px 10px;border-radius:5px;cursor:pointer;white-space:nowrap}
.menu-btn:hover,.menu.open .menu-btn{background:var(--surface-2)}
.menu-list{position:fixed;min-width:250px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:none;z-index:60}
.menu.open .menu-list{display:block}
.menu-list button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;background:none;border:0;padding:6px 10px;border-radius:5px;text-align:left;cursor:pointer;white-space:nowrap}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--accent);color:var(--accent-ink);outline:none}
.menu-list kbd{font-family:var(--font-num);font-size:11px;color:var(--muted)}
.menu-list button:hover kbd,.menu-list button:focus-visible kbd{color:inherit;opacity:.75}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.doc-title{margin-left:auto;color:var(--muted);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
#panelToggle{display:none;flex:none;margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}

/* options bar */
#options{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.opt-tool{font-weight:600;min-width:84px;display:flex;align-items:center;gap:8px;color:var(--text)}
.opt-tool::after{content:"";width:1px;height:20px;background:var(--line);margin-left:10px}
.opt{display:none;align-items:center;gap:10px}
.opt.show{display:flex}
.opt label{color:var(--muted)}
.opt output{min-width:44px;color:var(--text);font-size:12px}
.opt .grp{display:flex;align-items:center;gap:8px}
.opt .note{color:var(--muted);font-size:12px}
input[type=range]{accent-color:var(--accent);width:112px}
select,input[type=number],input[type=text]{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
input[type=number]{width:76px;font-family:var(--font-num)}
input[type=checkbox]{accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:6px;color:var(--text)!important;cursor:pointer}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* tool rail */
#tools{grid-row:3;grid-column:1;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 10px;overflow-y:auto;scrollbar-width:none}
.tool{position:relative;width:36px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:7px;color:var(--muted);cursor:pointer;flex:none}
.tool:hover{background:var(--surface-2);color:var(--text)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool .k{position:absolute;right:2px;bottom:1px;font:500 8px/1 var(--font-num);opacity:.6;text-transform:uppercase}
.rail-sep{width:24px;height:1px;background:var(--line);margin:6px 0;flex:none}
.colors{position:relative;width:38px;height:40px;flex:none}
.chip{position:absolute;width:24px;height:24px;border:2px solid #e9ecf1;border-radius:4px;box-shadow:0 0 0 1px #000;cursor:pointer;padding:0}
.chip.fg{left:0;top:0;z-index:2}
.chip.bg{right:0;bottom:0}
.mini{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px;display:grid;place-items:center;flex:none}
.mini:hover{color:var(--text)}
.mini svg{width:15px;height:15px}

/* stage */
#stage{grid-row:3;grid-column:2;position:relative;overflow:hidden;background:var(--stage);touch-action:none}
#view{position:absolute;inset:0;display:block;touch-action:none}
#textInput{position:absolute;z-index:5;background:rgba(76,155,255,.06);border:1px dashed var(--accent);outline:none;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.2;white-space:pre;min-width:12px;user-select:text;-webkit-user-select:text}
#dropHint{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:12px;display:none;place-items:center;font-size:15px;color:var(--text);background:rgba(76,155,255,.08);pointer-events:none}
#stage.dragover #dropHint{display:grid}

/* panels */
#panels{grid-row:3;grid-column:3;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel{border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.panel.grow{flex:1}
.panel h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.color-row{display:flex;align-items:center;gap:14px}
.color-row label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.color-row output{color:var(--text);font-size:12px}
input[type=color]{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.swatches button{aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:4px;cursor:pointer;padding:0}
.swatches button:hover{transform:scale(1.12)}
.layer-ctl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.layer-ctl select{width:100%}
.layer-ctl .op{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.layer-ctl .op label{color:var(--muted)}
.layer-ctl .op input{flex:1;width:auto}
.layer-ctl .op output{min-width:40px;text-align:right;font-size:12px}
#layerList{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:90px;display:flex;flex-direction:column;gap:2px}
.layer{display:grid;grid-template-columns:24px 52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.layer:hover{background:var(--surface-2)}
.layer.active{background:rgba(76,155,255,.16);border-color:rgba(76,155,255,.5)}
.layer .eye{background:none;border:0;padding:0;color:var(--text);cursor:pointer;display:grid;place-items:center}
.layer .eye[aria-pressed="false"]{color:var(--muted);opacity:.5}
.layer .eye svg{width:17px;height:17px}
.thumb{width:52px;height:36px;border-radius:3px;background:repeating-conic-gradient(#3b4049 0 25%,#2a2e35 0 50%) 0 0/8px 8px;border:1px solid var(--line)}
.lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname input{width:100%;padding:2px 4px}
.lmeta{font-size:11px;color:var(--muted)}
.layer-actions{display:flex;justify-content:space-between;gap:2px}
.layer-actions button{flex:1;height:30px;background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.layer-actions button:hover{background:var(--surface-2);color:var(--text)}
.layer-actions svg{width:18px;height:18px}
#historyPanel{height:190px;flex:none}
#historyList{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:1px}
#historyList button{width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:4px 8px;cursor:pointer;display:flex;gap:10px}
#historyList button:hover{background:var(--surface-2)}
#historyList button .n{color:var(--muted);font-size:11px;min-width:18px}
#historyList button.cur{background:rgba(76,155,255,.16);color:#fff}
#historyList button.future{color:var(--muted);opacity:.55}

/* status */
#status{grid-column:1/-1;display:flex;gap:20px;align-items:center;padding:0 12px;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
#status .hint{margin-left:auto;overflow:hidden;text-overflow:ellipsis}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,6,10,.55);display:grid;place-items:center;z-index:100}
#modal[hidden]{display:none}
#modal.floating{background:transparent;place-items:start end;padding:92px 292px 0 0}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(380px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;max-height:calc(100% - 32px)}
.dialog h3{margin:0;padding:14px 16px 0;font-size:14px;font-weight:600}
#modalBody{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px}
.field{display:grid;grid-template-columns:100px minmax(0,1fr) 54px;align-items:center;gap:10px}
.field label{color:var(--muted)}
.field input[type=range]{width:100%}
.field output{text-align:right;font-size:12px}
.field2{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px}
.field2 label{color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .btn{font-size:12px;padding:3px 9px}
.export-img{max-width:100%;max-height:50vh;object-fit:contain;background:repeating-conic-gradient(#3b4049 0 25%,#2a2e35 0 50%) 0 0/12px 12px;border-radius:6px;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
.muted{color:var(--muted)}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#0b0d10;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s;z-index:200;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.offscreen{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

@media (max-width:860px){
  body{grid-template-columns:46px minmax(0,1fr)}
  .brand span,.doc-title{display:none}
  #panelToggle{display:block}
  #panels{position:fixed;right:0;top:80px;bottom:26px;width:min(300px,88vw);transform:translateX(102%);transition:transform .2s;z-index:40;box-shadow:-12px 0 30px rgba(0,0,0,.45)}
  body.panels-open #panels{transform:none}
  #modal.floating{place-items:end center;padding:0 0 40px}
  #status .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  #panels,#toast{transition:none}
}
</style>
</head>
<body>
<header id="menubar">
  <div class="brand"><b></b><span>Lumen</span></div>
  <nav id="menus" aria-label="メニュー" style="display:flex;gap:2px"></nav>
  <div class="doc-title" id="docTitle"></div>
  <button id="panelToggle" aria-expanded="false">パネル</button>
</header>

<div id="options">
  <div class="opt-tool" id="optToolName">ブラシ</div>
  <div class="opt" data-for="brush eraser">
    <div class="grp"><label for="optSize">サイズ</label><input type="range" id="optSize" min="1" max="400"><output id="optSizeVal" class="num"></output></div>
    <div class="grp"><label for="optHard">硬さ</label><input type="range" id="optHard" min="0" max="100"><output id="optHardVal" class="num"></output></div>
    <div class="grp"><label for="optOpacity">不透明度</label><input type="range" id="optOpacity" min="1" max="100"><output id="optOpacityVal" class="num"></output></div>
  </div>
  <div class="opt" data-for="fill">
    <div class="grp"><label for="optTol">許容値</label><input type="range" id="optTol" min="0" max="255"><output id="optTolVal" class="num"></output></div>
    <label class="check"><input type="checkbox" id="optContig"> 隣接ピクセルのみ</label>
  </div>
  <div class="opt" data-for="shape">
    <div class="grp"><label for="optShape">形状</label><select id="optShape"><option value="rect">長方形</option><option value="ellipse">楕円</option><option value="line">直線</option></select></div>
    <label class="check"><input type="checkbox" id="optShapeFill"> 塗り（描画色）</label>
    <label class="check"><input type="checkbox" id="optShapeStroke"> 線（背景色）</label>
    <div class="grp"><label for="optShapeW">線幅</label><input type="range" id="optShapeW" min="1" max="80"><output id="optShapeWVal" class="num"></output></div>
  </div>
  <div class="opt" data-for="text">
    <div class="grp"><label for="optFont">書体</label><select id="optFont"><option value="sans">ゴシック</option><option value="serif">明朝</option><option value="mono">等幅</option></select></div>
    <div class="grp"><label for="optFontSize">サイズ</label><input type="number" id="optFontSize" min="6" max="600"><span class="note">px</span></div>
    <label class="check"><input type="checkbox" id="optBold"> 太字</label>
    <span class="note">Enter で確定 / Shift+Enter で改行</span>
  </div>
  <div class="opt" data-for="pick">
    <div class="grp"><label for="optPick">取得元</label><select id="optPick"><option value="all">表示中の全レイヤー</option><option value="layer">現在のレイヤー</option></select></div>
    <span class="note">Alt+クリックで背景色に設定</span>
  </div>
  <div class="opt" data-for="marquee">
    <div class="grp"><label for="optMarq">形状</label><select id="optMarq"><option value="rect">長方形</option><option value="ellipse">楕円</option></select></div>
  </div>
  <div class="opt" data-for="lasso">
    <div class="grp"><label for="optLasso">方式</label><select id="optLasso"><option value="free">フリーハンド</option><option value="poly">多角形</option></select></div>
  </div>
  <div class="opt" data-for="marquee lasso move">
    <button class="btn" data-cmd="select-all">すべてを選択</button>
    <button class="btn" data-cmd="sel-invert">選択範囲を反転</button>
    <button class="btn" data-cmd="deselect">選択を解除</button>
    <button class="btn" data-cmd="crop">選択範囲で切り抜き</button>
  </div>
  <div class="opt" data-for="hand zoom">
    <button class="btn" data-cmd="fit">画面に合わせる</button>
    <button class="btn" data-cmd="actual">100%</button>
  </div>
</div>

<aside id="tools" aria-label="ツール"></aside>

<main id="stage">
  <canvas id="view" aria-label="キャンバス"></canvas>
  <textarea id="textInput" wrap="off" spellcheck="false" hidden aria-label="テキスト入力"></textarea>
  <div id="dropHint">画像をドロップするとレイヤーとして配置します</div>
</main>

<aside id="panels" aria-label="パネル">
  <section class="panel">
    <h2>カラー</h2>
    <div class="color-row">
      <label for="fgInput"><input type="color" id="fgInput"> 描画色 <output id="fgHex" class="num"></output></label>
    </div>
    <div class="color-row">
      <label for="bgInput"><input type="color" id="bgInput"> 背景色 <output id="bgHex" class="num"></output></label>
    </div>
    <div class="swatches" id="swatches" aria-label="スウォッチ"></div>
  </section>
  <section class="panel grow">
    <h2>レイヤー</h2>
    <div class="layer-ctl">
      <label for="blendSel" class="sr">描画モード</label>
      <select id="blendSel"></select>
      <div class="op"><label for="opacityRange">不透明度</label><input type="range" id="opacityRange" min="0" max="100"><output id="opacityVal" class="num"></output></div>
    </div>
    <ul id="layerList"></ul>
    <div class="layer-actions">
      <button data-cmd="layer-new" title="新規レイヤー" aria-label="新規レイヤー"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button data-cmd="layer-dup" title="複製" aria-label="レイヤーを複製"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button data-cmd="layer-up" title="上へ移動" aria-label="レイヤーを上へ"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button data-cmd="layer-down" title="下へ移動" aria-label="レイヤーを下へ"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <button data-cmd="merge-down" title="下のレイヤーと結合" aria-label="下のレイヤーと結合"><svg class="i" viewBox="0 0 24 24"><path d="M7 4l5 5 5-5M12 9v6"/><rect x="5" y="15" width="14" height="5" rx="1.5"/></svg></button>
      <button data-cmd="layer-del" title="削除" aria-label="レイヤーを削除"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
    </div>
  </section>
  <section class="panel" id="historyPanel">
    <h2>ヒストリー</h2>
    <ul id="historyList"></ul>
  </section>
</aside>

<footer id="status">
  <span id="stZoom" class="num"></span>
  <span id="stSize" class="num"></span>
  <span id="stPos" class="num"></span>
  <span id="stSel" class="num"></span>
  <span id="stHint" class="hint"></span>
</footer>

<div id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <footer><button class="btn" id="modalCancel">キャンセル</button><button class="btn primary" id="modalOk">OK</button></footer>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileOpen" accept="image/*" class="offscreen" aria-label="画像を開く">
<input type="file" id="filePlace" accept="image/*" class="offscreen" aria-label="レイヤーとして配置">

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
function cloneCanvas(src){const c=makeCanvas(src.width,src.height);c.getContext('2d').drawImage(src,0,0);return c;}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

/* ---------- state ---------- */
const S={
  name:'夕暮れのサンプル',w:1200,h:800,layers:[],active:0,sel:null,override:null,
  zoom:1,panX:0,panY:0,tool:'brush',fg:'#ffffff',bg:'#000000',

const HANDLERS={
  brush:{down:brushDown,move:brushMove,up:brushUp},
  eraser:{down:brushDown,move:brushMove,up:brushUp},
  move:{
    down(p){
      const L=activeLayer();if(!L.visible){toast('非表示のレイヤーは移動できません');return false;}
      const sel=S.sel;let fl,base=null;
      if(sel){
        const P=selPath(sel),rule=selRule(sel);
        fl=makeCanvas(sel.w,sel.h);const fg=fl.getContext('2d');fg.translate(-sel.x,-sel.y);fg.clip(P,rule);fg.drawImage(L.canvas,0,0);
        base=cloneCanvas(L.canvas);const bg=base.getContext('2d');bg.save();bg.clip(P,rule);bg.clearRect(sel.x,sel.y,sel.w,sel.h);bg.restore();
      }
      else fl=cloneCanvas(L.canvas);
      return{start:p,dx:0,dy:0,fl,base,ox:sel?sel.x:0,oy:sel?sel.y:0,hasSel:!!sel};
    },
    move(p,e,d){
      let dx=Math.round(p.x-d.start.x),dy=Math.round(p.y-d.start.y);
      if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;}
      d.dx=dx;d.dy=dy;
      scheduleLive(()=>{const g=beginScratch(false);if(d.base)g.drawImage(d.base,0,0);g.drawImage(d.fl,d.ox+d.dx,d.oy+d.dy);endScratch(g);});
    },
    up(p,e,d){
      if(!d.dx&&!d.dy){cancelOverride();return;}
      if(d.hasSel)S.sel=translateSel(S.sel,d.dx,d.dy);
      commitOverride('移動');
    }
  },
  marquee:{
    down(p){S.sel=null;requestRender();return{start:p};},
    move(p,e,d){
      let w=p.x-d.start.x,h=p.y-d.start.y;
      if(e.shiftKey){const s=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*s;h=Math.sign(h||1)*s;}
      let x0=Math.min(d.start.x,d.start.x+w),y0=Math.min(d.start.y,d.start.y+h),aw=Math.abs(w),ah=Math.abs(h);
      if(e.altKey){x0=d.start.x-aw;y0=d.start.y-ah;aw*=2;ah*=2;}
      S.sel=S.marq.shape==='ellipse'?finalizeSel({shape:'ellipse',rx:x0,ry:y0,rw:aw,rh:ah}):makeRectSel(x0,y0,aw,ah);
      requestRender();updateStatus();
    },
    up(){if(S.sel&&(S.sel.w<2||S.sel.h<2))S.sel=null;requestRender();updateStatus();}
  },
  lasso:{
    down(p,e){
      if(S.lasso.mode==='poly'){polyClick(p,e);return false;}
      S.sel=null;requestRender();updateStatus();return{pts:[[p.x,p.y]]};
    },
    move(p,e,d){const l=d.pts[d.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])*S.zoom>=2)d.pts.push([p.x,p.y]);requestRender();},
    up(p,e,d){const s=d.pts.length>=3?finalizeSel({shape:'poly',pts:d.pts}):null;S.sel=s&&s.w>=2&&s.h>=2?s:null;requestRender();updateStatus();}
  },
  fill:{down(p){const L=activeLayer();if(!L.visible){toast('非表示のレイヤーには塗れません');return false;}if(floodFill(L,p.x,p.y)){touch(L);pushHistory('塗りつぶし');}return false;}},
  pick:{down(p,e){pickColor(p,e.altKey);return false;}},
  text:{down(p){openText(p);return false;}},
  shape:{
    down(p){const L=activeLayer();if(!L.visible){toast('非表示のレイヤーには描けません');return false;}
      if(S.shape.type!=='line'&&!S.shape.fill&&!S.shape.stroke){toast('塗りか線のどちらかをオンにしてください');return false;}return{start:p,moved:false};},
    move(p,e,d){d.moved=true;const s=shapeGeom(d,p,e.shiftKey);d.geom=s;scheduleLive(()=>{const g=beginScratch(true);clipSel(g);drawShape(g,s);endScratch(g);});},
    up(p,e,d){flushLive();const s=d.geom;if(!d.moved||!s||Math.hypot(s.x1-s.x0,s.y1-s.y0)<2){cancelOverride();return;}
      commitOverride({rect:'長方形',ellipse:'楕円',line:'直線'}[S.shape.type]);}
  },
  hand:{
    down(p){view.style.cursor='grabbing';return{sx:p.sx,sy:p.sy,px:S.panX,py:S.panY};},
    move(p,e,d){S.panX=d.px+p.sx-d.sx;S.panY=d.py+p.sy-d.sy;requestRender();}
  },
  zoom:{down(p,e){stepZoom(e.altKey?-1:1,p.sx,p.sy);return false;}},
};
function brushDown(p,e){
  if(e.altKey&&S.tool==='brush'){pickColor(p,false);return false;}
  const L=activeLayer();if(!L.visible){toast('非表示のレイヤーには描けません。目のアイコンで表示してください');return false;}
  const erase=S.tool==='eraser',set=S[S.tool];
  ensureSize(strokeCv);const sg=strokeCv.getContext('2d');sg.clearRect(0,0,S.w,S.h);
  const d={erase,set,sg,tip:getTip(set.size,set.hardness,erase?'#000000':S.fg),carry:0,last:p};
  const pr=pressureOf(e);
  if(e.shiftKey&&S.lastPt){stamp(d,S.lastPt.x,S.lastPt.y,pr);stampLine(d,S.lastPt.x,S.lastPt.y,p.x,p.y,pr);}
  else stamp(d,p.x,p.y,pr);
  scheduleLive(()=>buildBrushLive(d));return d;
}
function brushMove(p,e,d){
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];const list=evs.length?evs:[e];
  for(const ev of list){const q=toDoc(ev);stampLine(d,d.last.x,d.last.y,q.x,q.y,pressureOf(ev));d.last=q;}
  scheduleLive(()=>buildBrushLive(d));
}
function brushUp(p,e,d){S.lastPt={x:d.last.x,y:d.last.y};commitOverride(d.erase?'消しゴム':'ブラシ');}

/* ---------- pointer events ---------- */
const ptrs=new Map();let pinch=null;
function effectiveTool(e){return(spaceHeld||e.button===1)?'hand':S.tool;}
function cancelDrag(){if(!drag)return;if(drag.tool!=='hand'&&drag.tool!=='marquee')cancelOverride();drag=null;updateCursor();}
view.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    cancelDrag();const[a,b]=[...ptrs.values()],r=view.getBoundingClientRect();
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,zoom:S.zoom,panX:S.panX,panY:S.panY};return;
  }
  if(ptrs.size>2||drag)return;
  if(textEdit){commitText();return;}
  if(e.button===2)return;
  closeMenus();
  const p=toDoc(e),tool=effectiveTool(e),T=HANDLERS[tool];if(!T)return;
  const d=T.down(p,e);if(d===false||d==null)return;
  drag=Object.assign(d,{tool,id:e.pointerId});
  try{view.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
view.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const[a,b]=[...ptrs.values()],r=view.getBoundingClientRect();
    const nd=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
    const z=clamp(pinch.zoom*nd/pinch.d,.02,32),dx=(pinch.mx-pinch.panX)/pinch.zoom,dy=(pinch.my-pinch.panY)/pinch.zoom;
    S.zoom=z;S.panX=mx-dx*z;S.panY=my-dy*z;requestRender();updateStatus();return;
  }
  const p=toDoc(e);pointer.sx=p.sx;pointer.sy=p.sy;pointer.inside=true;pointer.shift=e.shiftKey;updatePos(p);
  if(drag&&e.pointerId===drag.id){const T=HANDLERS[drag.tool];if(T.move)T.move(p,e,drag);}
  else if(S.tool==='brush'||S.tool==='eraser'||polyDraft)requestRender();
});
function endPointer(e){
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&e.pointerId===drag.id){const d=drag,T=HANDLERS[d.tool];drag=null;if(T.up)T.up(toDoc(e),e,d);updateCursor();requestRender();}
}
view.addEventListener('pointerup',endPointer);
view.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(drag&&e.pointerId===drag.id)cancelDrag();});
view.addEventListener('pointerleave',()=>{pointer.inside=false;$('#stPos').textContent='';requestRender();});
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('wheel',e=>{
  e.preventDefault();const r=view.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  const k=e.deltaMode===1?16:1;
  if(e.ctrlKey||e.metaKey)zoomAt(S.zoom*Math.exp(-e.deltaY*k*.0022),sx,sy);
  else{let dx=e.deltaX*k,dy=e.deltaY*k;if(e.shiftKey&&!dx){dx=dy;dy=0;}S.panX-=dx;S.panY-=dy;requestRender();}
},{passive:false});
function updateCursor(){
  if(drag&&drag.tool==='hand'){view.style.cursor='grabbing';return;}
  view.style.cursor=spaceHeld?'grab':TOOLS[S.tool].cursor;
}

/* ---------- text ---------- */
const ta=$('#textInput');
const FONTS={sans:'"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",sans-serif',serif:'"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif',mono:'"IBM Plex Mono",ui-monospace,Menlo,monospace'};
function fontStr(px){return`${S.text.bold?700:400} ${px}px ${FONTS[S.text.family]}`;}
function openText(p){
  if(!activeLayer())return;textEdit={x:Math.round(p.x),y:Math.round(p.y)};ta.value='';ta.hidden=false;styleText();positionText();
  setTimeout(()=>ta.focus(),0);
}
function styleText(){ta.style.font=fontStr(S.text.size*S.zoom);ta.style.lineHeight='1.2';ta.style.color=S.fg;autosizeText();}
function positionText(){if(!textEdit)return;ta.style.left=(S.panX+textEdit.x*S.zoom)+'px';ta.style.top=(S.panY+textEdit.y*S.zoom)+'px';if(ta._z!==S.zoom){ta._z=S.zoom;styleText();}}
function autosizeText(){ta.style.width='0px';ta.style.height='0px';ta.style.width=(ta.scrollWidth+6)+'px';ta.style.height=ta.scrollHeight+'px';}
function cancelText(){textEdit=null;ta.hidden=true;ta.value='';requestRender();}
async function commitText(){
  if(!textEdit)return;const v=ta.value,{x,y}=textEdit;cancelText();ta.blur();
  if(!v.trim())return;
  const sz=S.text.size,f=fontStr(sz);
  try{await Promise.race([document.fonts.load(f,v),new Promise(r=>setTimeout(r,1200))]);}catch(_){}
  const L=addLayer(v.split('\n')[0].trim().slice(0,24)||'テキスト');
  const g=L.canvas.getContext('2d');g.font=f;g.fillStyle=S.fg;g.textBaseline='top';
  v.split('\n').forEach((line,i)=>g.fillText(line,x,y+sz*.1+i*sz*1.2));
  touch(L);pushHistory('テキスト');
}
ta.addEventListener('input',autosizeText);
ta.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();commitText();}
  else if(e.key==='Escape'){e.preventDefault();cancelText();}
});
ta.addEventListener('blur',()=>{if(textEdit)commitText();});

/* ---------- layers ---------- */
function addLayer(name,atTop){
  const L=newLayer(name||`レイヤー ${++layerNo}`);
  const at=atTop?S.layers.length:S.active+1;S.layers.splice(at,0,L);S.active=at;touch(L);return L;
}
function duplicateLayer(){const s=activeLayer();const L=newLayer(s.name+' のコピー');L.canvas.getContext('2d').drawImage(s.canvas,0,0);Object.assign(L,{opacity:s.opacity,blend:s.blend,visible:s.visible});S.layers.splice(S.active+1,0,L);S.active++;touch(L);pushHistory('レイヤーを複製');}
function deleteLayer(){if(S.layers.length<2){toast('レイヤーが 1 枚のときは削除できません');return;}S.layers.splice(S.active,1);S.active=Math.max(0,S.active-1);compDirty=true;pushHistory('レイヤーを削除');}
function moveLayer(dir){const i=S.active,j=i+dir;if(j<0||j>=S.layers.length)return;[S.layers[i],S.layers[j]]=[S.layers[j],S.layers[i]];S.active=j;compDirty=true;pushHistory(dir>0?'レイヤーを上へ':'レイヤーを下へ');}
function mergeDown(){
  if(S.active===0){toast('下にレイヤーがありません');return;}
  const up=S.layers[S.active],lo=S.layers[S.active-1],g=lo.canvas.getContext('2d');
  if(up.visible){g.save();g.globalAlpha=up.opacity;g.globalCompositeOperation=up.blend;g.drawImage(up.canvas,0,0);g.restore();}
  S.layers.splice(S.active,1);S.active--;touch(lo);pushHistory('下のレイヤーと結合');
}
function flatten(){if(compDirty){composite();compDirty=false;}const L=newLayer('背景');L.canvas.getContext('2d').drawImage(comp,0,0);S.layers=[L];S.active=0;touch(L);pushHistory('画像を統合');}

/* ---------- image ops ---------- */
function forAllLayers(fn){S.layers.forEach(L=>{const c=fn(L);if(c)L.canvas=c;touch(L);});}
function rotate(dir){
  const ow=S.w,oh=S.h;
  forAllLayers(L=>{const c=makeCanvas(oh,ow),g=c.getContext('2d');if(dir>0){g.translate(oh,0);g.rotate(Math.PI/2);}else{g.translate(0,ow);g.rotate(-Math.PI/2);}g.drawImage(L.canvas,0,0);return c;});
  S.w=oh;S.h=ow;S.sel=null;fitView();pushHistory(dir>0?'90° 回転（時計回り）':'90° 回転（反時計回り）');
}
function flip(horiz){
  forAllLayers(L=>{const c=makeCanvas(S.w,S.h),g=c.getContext('2d');g.translate(horiz?S.w:0,horiz?0:S.h);g.scale(horiz?-1:1,horiz?1:-1);g.drawImage(L.canvas,0,0);return c;});
  pushHistory(horiz?'左右に反転':'上下に反転');
}
function cropToSel(){
  if(!S.sel){toast('先に長方形選択ツール（M）で切り抜く範囲を選んでください');return;}
  const s=S.sel;forAllLayers(L=>{const c=makeCanvas(s.w,s.h);c.getContext('2d').drawImage(L.canvas,-s.x,-s.y);return c;});
  S.w=s.w;S.h=s.h;S.sel=null;fitView();pushHistory('切り抜き');
}
function resizeImage(nw,nh){
  forAllLayers(L=>{const c=makeCanvas(nw,nh),g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(L.canvas,0,0,nw,nh);return c;});
  S.w=nw;S.h=nh;S.sel=null;fitView();pushHistory('画像サイズ');
}
function clearSel(){
  if(!S.sel){toast('消去する範囲を長方形選択ツール（M）で選んでください');return;}
  const L=activeLayer(),g=L.canvas.getContext('2d');g.save();clipSel(g);g.clearRect(S.sel.x,S.sel.y,S.sel.w,S.sel.h);g.restore();touch(L);pushHistory('消去');
}
function fillSel(){const L=activeLayer(),g=L.canvas.getContext('2d'),r=region();g.save();clipSel(g);g.fillStyle=S.fg;g.fillRect(r.x,r.y,r.w,r.h);g.restore();touch(L);pushHistory('描画色で塗りつぶし');}
/* cut / copy / paste: an internal clipboard keeps position; the system clipboard is written when the browser allows it */
let clip=null,preferInternal=false,pasteHandled=false;
function copySel(merged){
  const r=region();let src;
  if(merged){if(compDirty){composite();compDirty=false;}src=comp;}else src=activeLayer().canvas;
  const c=makeCanvas(r.w,r.h),g=c.getContext('2d');g.translate(-r.x,-r.y);clipSel(g);g.drawImage(src,0,0);
  clip={canvas:c,x:r.x,y:r.y};preferInternal=true;
  try{if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(res=>c.toBlob(res,'image/png'))})]).catch(()=>{});}}catch(_){}
}
function cutSel(){
  const L=activeLayer();if(!L.visible){toast('非表示のレイヤーからは切り取れません');return;}
  copySel(false);const r=region(),g=L.canvas.getContext('2d');g.save();clipSel(g);g.clearRect(r.x,r.y,r.w,r.h);g.restore();
  touch(L);pushHistory('切り取り');toast('切り取りました。Ctrl+V で新しいレイヤーに貼り付けます');

function pasteInternal(){
  if(!clip){toast('ほかのアプリの画像は Ctrl+V で貼り付けてください');return;}

/* ---------- filters ---------- */
function mul3(A,B){const C=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)C[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return C;}
function boxesForGauss(sigma,n){const wI=Math.sqrt(12*sigma*sigma/n+1);let wl=Math.floor(wI);if(wl%2===0)wl--;const wu=wl+2;const m=Math.round((12*sigma*sigma-n*wl*wl-4*n*wl-3*n)/(-4*wl-4));const out=[];for(let i=0;i<n;i++)out.push(i<m?wl:wu);return out;}
function boxH(src,dst,w,h,r){
  if(r<1){dst.set(src);return;}const inv=1/(r+r+1);
  for(let y=0;y<h;y++){const row=y*w;for(let ch=0;ch<4;ch++){
    let v=0;for(let k=-r;k<=r;k++)v+=src[(row+clamp(k,0,w-1))*4+ch];dst[row*4+ch]=v*inv;
    for(let x=1;x<w;x++){v+=src[(row+Math.min(x+r,w-1))*4+ch]-src[(row+Math.max(x-r-1,0))*4+ch];dst[(row+x)*4+ch]=v*inv;}
  }}
}
function boxV(src,dst,w,h,r){
  if(r<1){dst.set(src);return;}const inv=1/(r+r+1);
  for(let x=0;x<w;x++){for(let ch=0;ch<4;ch++){
    let v=0;for(let k=-r;k<=r;k++)v+=src[(clamp(k,0,h-1)*w+x)*4+ch];dst[x*4+ch]=v*inv;
    for(let y=1;y<h;y++){v+=src[(Math.min(y+r,h-1)*w+x)*4+ch]-src[(Math.max(y-r-1,0)*w+x)*4+ch];dst[(y*w+x)*4+ch]=v*inv;}
  }}
}
const FX={
  adjust(img,p){
    const d=img.data,bri=(p.brightness||0)*1.28,c=clamp((p.contrast||0)*2.55,-254,254),f=(259*(c+255))/(255*(259-c));
    const s=1+(p.saturation||0)/100,a=(p.hue||0)*Math.PI/180,cos=Math.cos(a),sin=Math.sin(a);
    if(!bri&&!c&&s===1&&!a)return;
    const hm=[.213+cos*.787-sin*.213,.715-cos*.715-sin*.715,.072-cos*.072+sin*.928,.213-cos*.213+sin*.143,.715+cos*.285+sin*.140,.072-cos*.072-sin*.283,.213-cos*.213-sin*.787,.715-cos*.715+sin*.715,.072+cos*.928+sin*.072];
    const sr=.213*(1-s),sg=.715*(1-s),sb=.072*(1-s),m=mul3([sr+s,sg,sb,sr,sg+s,sb,sr,sg,sb+s],hm);
    for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const r=d[i],g=d[i+1],b=d[i+2];
      d[i]=f*(m[0]*r+m[1]*g+m[2]*b+bri-128)+128;d[i+1]=f*(m[3]*r+m[4]*g+m[5]*b+bri-128)+128;d[i+2]=f*(m[6]*r+m[7]*g+m[8]*b+bri-128)+128;}
  },
  gray(img){const d=img.data;for(let i=0;i<d.length;i+=4){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=v;}},
  sepia(img){const d=img.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];d[i]=.393*r+.769*g+.189*b;d[i+1]=.349*r+.686*g+.168*b;d[i+2]=.272*r+.534*g+.131*b;}},
  invert(img){const d=img.data;for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}},
  posterize(img,p){const n=Math.max(2,p.levels|0),st=255/(n-1),d=img.data;for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++)d[i+c]=Math.round(d[i+c]/st)*st;},
  blur(img,p){
    const sigma=p.radius;if(!(sigma>=.3))return;const{width:w,height:h,data:d}=img,n=w*h,a=new Float32Array(n*4),b=new Float32Array(n*4);
    for(let i=0;i<n;i++){const j=i*4,al=d[j+3]/255;a[j]=d[j]*al;a[j+1]=d[j+1]*al;a[j+2]=d[j+2]*al;a[j+3]=d[j+3];}
    for(const s of boxesForGauss(sigma,3)){const r=(s-1)/2;boxH(a,b,w,h,r);boxV(b,a,w,h,r);}
    for(let i=0;i<n;i++){const j=i*4,al=a[j+3];d[j+3]=al;if(al>0){const k=255/al;d[j]=a[j]*k;d[j+1]=a[j+1]*k;d[j+2]=a[j+2]*k;}else d[j]=d[j+1]=d[j+2]=0;}
  },
  sharpen(img,p){
    const a=p.amount/100,{width:w,height:h,data:d}=img,src=new Uint8ClampedArray(d),row=w*4;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4;for(let c=0;c<3;c++){const k=i+c;d[k]=src[k]*(1+4*a)-a*(src[k-4]+src[k+4]+src[k-row]+src[k+row]);}}
  },
};
function applyNow(name,fn){

  function preview(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;if(closed)return;g.putImageData(compute(),r.x,r.y);compDirty=true;requestRender();});}

/* ---------- documents & files ---------- */
function createDoc(w,h,bg,name,histName){
  if(textEdit)cancelText();polyDraft=null;
  S.w=w;S.h=h;S.name=name;S.sel=null;S.override=null;S.lastPt=null;layerNo=1;
  const L=newLayer('背景');if(bg&&bg!=='transparent'){const g=L.canvas.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,w,h);}
  S.layers=[L];S.active=0;touch(L);fitView();resetHistory(histName||'新規');return L;
}
function loadImageFile(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error('画像ファイル（PNG・JPEG・WebP・GIF など）を選んでください'));return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{res({img,url,name:(file.name||'画像').replace(/\.[^.]+$/,'')});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('この画像は読み込めませんでした。別の形式で保存し直してお試しください'));};
    img.src=url;
  });
}
async function openFile(file){
  try{const{img,url,name}=await loadImageFile(file);
    let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,6000/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    S.w=w;S.h=h;const L=newLayer('背景');L.canvas.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    S.name=name;S.sel=null;polyDraft=null;S.override=null;S.lastPt=null;layerNo=1;S.layers=[L];S.active=0;touch(L);fitView();resetHistory('開く');
    if(sc<1)toast('大きな画像のため 6000px 以内に縮小して開きました');
  }catch(err){toast(err.message);}
}
async function placeFile(file){
  try{const{img,url,name}=await loadImageFile(file);
    const sc=Math.min(1,S.w/img.naturalWidth,S.h/img.naturalHeight),dw=Math.round(img.naturalWidth*sc),dh=Math.round(img.naturalHeight*sc);
    const L=addLayer(name);L.canvas.getContext('2d').drawImage(img,Math.round((S.w-dw)/2),Math.round((S.h-dh)/2),dw,dh);URL.revokeObjectURL(url);
    touch(L);pushHistory('配置');
  }catch(err){toast(err.message);}
}

$('#filePlace').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)placeFile(f);});

async function exportImage(type){
  if(compDirty){composite();compDirty=false;}
  let c=comp;
  if(type==='jpeg'){c=makeCanvas(S.w,S.h);const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,S.w,S.h);g.drawImage(comp,0,0);}
  const blob=await new Promise(r=>c.toBlob(r,'image/'+type,.92));
  if(!blob){toast('書き出しに失敗しました。画像サイズを小さくしてお試しください');return;}
  if(blob.type!=='image/'+type){toast('このブラウザは '+type.toUpperCase()+' の書き出しに対応していません。PNG をお使いください');return;}
  const ext=type==='jpeg'?'jpg':type,filename=(S.name||'image').replace(/[\\/:*?"<>|]+/g,'_')+'.'+ext;
  if(downloads){
    try{await downloads.save({filename,data:blob});toast(filename+' を保存しました');return;}
    catch(err){const code=err&&err.code;
      if(code==='declined'){toast('保存をキャンセルしました');return;}
      if(code==='rate_limited'){toast('保存の確認が開いています。少し待ってからお試しください');return;}
      if(code==='too_large'){toast('ファイルが大きすぎます。画像サイズを小さくしてお試しください');return;}
    }
  }
  if(!window.claude){
    const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);toast(filename+' を保存しました');return;
  }
  const url=URL.createObjectURL(blob),wrap=el('div');wrap.style.cssText='display:flex;flex-direction:column;gap:10px';
  const im=el('img','export-img');im.src=url;im.alt='書き出した画像';
  wrap.append(im,el('div','muted','この表示ではファイルを直接保存できません。画像を右クリック（スマートフォンでは長押し）して保存してください。'));
  modal({title:filename,content:wrap,ok:'閉じる',cancel:null,onOk(){URL.revokeObjectURL(url);}});
}

    items.forEach(it=>{if(it==='-'){list.append(el('hr'));return;}const[cmd,text,kb]=it;const btn=el('button');btn.dataset.cmd=cmd;btn.setAttribute('role','menuitem');
      const sp=el('span');sp.textContent=text;btn.append(sp);if(kb){const k=el('kbd');k.textContent=kb;btn.append(k);}list.append(btn);});
    b.addEventListener('click',()=>{m.classList.contains('open')?closeMenus():openMenu(m);});
    b.addEventListener('mouseenter',()=>{if($('.menu.open')&&!m.classList.contains('open'))openMenu(m);});
    m.append(b,list);nav.append(m);
  });
}
function openMenu(m){
  closeMenus();if(textEdit)commitText();m.classList.add('open');m.firstChild.setAttribute('aria-expanded','true');
  const r=m.firstChild.getBoundingClientRect(),list=m.lastChild;
  list.style.top=(r.bottom+3)+'px';list.style.left=Math.max(8,Math.min(r.left,innerWidth-list.offsetWidth-8))+'px';
}
function closeMenus(){$$('.menu.open').forEach(m=>{m.classList.remove('open');m.firstChild.setAttribute('aria-expanded','false');});}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))closeMenus();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(!b)return;closeMenus();runCmd(b.dataset.cmd);});
function runCmd(c){if(drag)return;if(textEdit&&c!=='undo')commitText();const f=CMD[c];if(f)f();}

/* ---------- tools UI ---------- */

  });

  const fg=el('button','chip fg');fg.title='描画色';fg.setAttribute('aria-label','描画色を選ぶ');fg.addEventListener('click',()=>$('#fgInput').click());
  const bg=el('button','chip bg');bg.title='背景色';bg.setAttribute('aria-label','背景色を選ぶ');bg.addEventListener('click',()=>$('#bgInput').click());
  cw.append(fg,bg);rail.append(cw);

  const rs=el('button','mini','<svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="9" height="9" fill="currentColor"/><rect x="11" y="11" width="9" height="9"/></svg>');rs.title='初期色に戻す（D）';rs.setAttribute('aria-label','色を初期化');rs.addEventListener('click',resetColors);
  const row=el('div');row.style.cssText='display:flex;gap:2px;margin-top:4px';row.append(sw,rs);rail.append(row);

function refreshToolMeta(){
  const m=TOOLS.marquee,l=TOOLS.lasso;
  m.icon=m.icons[S.marq.shape];m.label=S.marq.shape==='ellipse'?'楕円選択':'長方形選択';
  l.icon=l.icons[S.lasso.mode];l.label=S.lasso.mode==='poly'?'多角形選択':'なげなわ';l.hint=l.hints[S.lasso.mode];
  ['marquee','lasso'].forEach(id=>{const b=$(`.tool[data-tool="${id}"]`);if(!b)return;b.querySelector('svg').innerHTML=TOOLS[id].icon;b.title=`${TOOLS[id].label}（${TOOLS[id].key.toUpperCase()}）`;b.setAttribute('aria-label',TOOLS[id].label);});
  if(S.tool==='marquee'||S.tool==='lasso'){$('#optToolName').textContent=TOOLS[S.tool].label;$('#stHint').textContent=TOOLS[S.tool].hint;}
  $('#optMarq').value=S.marq.shape;$('#optLasso').value=S.lasso.mode;
}
function setMarqShape(v){S.marq.shape=v;refreshToolMeta();}
function setLassoMode(v){S.lasso.mode=v;cancelPoly();refreshToolMeta();}
function selectTool(id){
  if(drag)return;if(textEdit&&id!=='text')commitText();
  if(id!=='lasso'||S.lasso.mode!=='poly')cancelPoly();
  S.tool=id;$$('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===id?'true':'false'));
  syncOptions();updateCursor();$('#stHint').textContent=TOOLS[id].hint;requestRender();
}
function setOut(id,v,suf){$('#'+id).value=v;$('#'+id+'Val').textContent=Math.round(v)+suf;}
function syncOptions(){
  const t=S.tool;$('#optToolName').textContent=TOOLS[t].label;
  $$('.opt').forEach(o=>o.classList.toggle('show',o.dataset.for.split(' ').includes(t)));
  if(t==='brush'||t==='eraser'){const s=S[t];setOut('optSize',s.size,'px');setOut('optHard',s.hardness,'%');setOut('optOpacity',s.opacity,'%');}
  setOut('optTol',S.fill.tol,'');$('#optContig').checked=S.fill.contig;
  $('#optShape').value=S.shape.type;$('#optShapeFill').checked=S.shape.fill;$('#optShapeStroke').checked=S.shape.stroke;setOut('optShapeW',S.shape.width,'px');

}
const bset=()=>S.tool==='eraser'?S.eraser:S.brush;
$('#optSize').addEventListener('input',e=>{bset().size=+e.target.value;syncOptions();requestRender();});

$('#optShape').addEventListener('change',e=>{S.shape.type=e.target.value;});
$('#optShapeFill').addEventListener('change',e=>{S.shape.fill=e.target.checked;});
$('#optShapeStroke').addEventListener('change',e=>{S.shape.stroke=e.target.checked;});
$('#optShapeW').addEventListener('input',e=>{S.shape.width=+e.target.value;syncOptions();});

/* ---------- colors ---------- */
const SWATCHES=['#000000','#ffffff','#8c94a2','#e5484d','#f76b15','#ffc53d','#46a758','#12a594','#0090ff','#3e63dd','#8e4ec6','#d6409f','#ffe2a8','#f6a35c','#c0607a','#4b3b78','#141b3d','#a18072'];
function setColor(which,hex){
  S[which]=hex.toLowerCase();
  $('.chip.'+which).style.background=S[which];$('#'+which+'Input').value=S[which];$('#'+which+'Hex').textContent=S[which].toUpperCase();
  if(which==='fg'&&textEdit)ta.style.color=S.fg;
}
function swapColors(){const f=S.fg;setColor('fg',S.bg);setColor('bg',f);}
function resetColors(){setColor('fg','#000000');setColor('bg','#ffffff');}
$('#fgInput').addEventListener('input',e=>setColor('fg',e.target.value));

function buildSwatches(){const box=$('#swatches');SWATCHES.forEach(c=>{const b=el('button');b.style.background=c;b.title=c.toUpperCase()+'（Alt+クリックで背景色）';b.setAttribute('aria-label','色 '+c);b.addEventListener('click',e=>setColor(e.altKey?'bg':'fg',c));box.append(b);});}

/* ---------- panels ---------- */
const BLENDS=[['source-over','通常'],['multiply','乗算'],['screen','スクリーン'],['overlay','オーバーレイ'],['darken','比較（暗）'],['lighten','比較（明）'],['color-dodge','覆い焼きカラー'],['color-burn','焼き込みカラー'],['hard-light','ハードライト'],['soft-light','ソフトライト'],['difference','差の絶対値'],['exclusion','除外'],['hue','色相'],['saturation','彩度'],['color','カラー'],['luminosity','輝度']];
const EYE_ON='<svg class="i" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6a10 10 0 0 1 1.4-.1c6 0 9.5 6.1 9.5 6.1a17 17 0 0 1-2.6 3.3M6.6 7.4A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.2-1"/></svg>';
function drawThumb(c,L){
  const g=c.getContext('2d'),tw=c.width,th=c.height;g.clearRect(0,0,tw,th);
  const s=Math.min(tw/S.w,th/S.h),w=S.w*s,h=S.h*s;g.imageSmoothingQuality='high';g.drawImage(L.canvas,(tw-w)/2,(th-h)/2,w,h);
}
function refreshLayers(){
  const ul=$('#layerList');ul.innerHTML='';
  for(let i=S.layers.length-1;i>=0;i--){
    const L=S.layers[i],li=el('li','layer'+(i===S.active?' active':''));li.dataset.index=i;
    li.innerHTML=`<button class="eye" aria-label="表示の切り替え" aria-pressed="${L.visible}">${L.visible?EYE_ON:EYE_OFF}</button><canvas class="thumb" width="104" height="72"></canvas><span class="lname" title="ダブルクリックで名前を変更"></span><span class="lmeta num"></span>`;
    $('.lname',li).textContent=L.name;
    const meta=[];if(L.opacity<1)meta.push(Math.round(L.opacity*100)+'%');if(L.blend!=='source-over')meta.push((BLENDS.find(b=>b[0]===L.blend)||[])[1]);$('.lmeta',li).textContent=meta.join(' ');
    drawThumb($('canvas',li),L);ul.append(li);
  }
  const A=activeLayer();if(A){$('#blendSel').value=A.blend;$('#opacityRange').value=Math.round(A.opacity*100);$('#opacityVal').textContent=Math.round(A.opacity*100)+'%';}
}
$('#layerList').addEventListener('click',e=>{
  const li=e.target.closest('.layer');if(!li||drag)return;const i=+li.dataset.index;
  if(e.target.closest('.eye')){const L=S.layers[i];L.visible=!L.visible;compDirty=true;refreshLayers();requestRender();return;}
  if(e.target.closest('input'))return;
  if(S.active!==i){if(textEdit)commitText();S.active=i;refreshLayers();}
});
$('#layerList').addEventListener('dblclick',e=>{
  const span=e.target.closest('.lname');if(!span)return;const i=+span.closest('.layer').dataset.index,L=S.layers[i];
  const inp=el('input');inp.type='text';inp.value=L.name;inp.setAttribute('aria-label','レイヤー名');span.textContent='';span.append(inp);inp.focus();inp.select();
  let done=false;const finish=save=>{if(done)return;done=true;const v=inp.value.trim();if(save&&v&&v!==L.name){L.name=v;pushHistory('名前を変更');}else refreshLayers();};
  inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter')finish(true);else if(ev.key==='Escape')finish(false);});
  inp.addEventListener('blur',()=>finish(true));
});
$('#blendSel').innerHTML=BLENDS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
$('#blendSel').addEventListener('change',e=>{activeLayer().blend=e.target.value;compDirty=true;pushHistory('描画モード');});
$('#opacityRange').addEventListener('input',e=>{activeLayer().opacity=+e.target.value/100;$('#opacityVal').textContent=e.target.value+'%';compDirty=true;requestRender();});
$('#opacityRange').addEventListener('change',()=>pushHistory('不透明度'));
function refreshHistory(){
  const ul=$('#historyList');ul.innerHTML='';
  H.stack.forEach((h,i)=>{const li=el('li'),b=el('button',i===H.index?'cur':i>H.index?'future':'');
    const n=el('span','n num');n.textContent=i+1;const t=el('span');t.textContent=h.name;b.append(n,t);b.addEventListener('click',()=>restore(i));li.append(b);ul.append(li);});
  const cur=$('.cur',ul);if(cur)ul.scrollTop=cur.parentElement.offsetTop-ul.clientHeight+40;
}
function refreshAll(){refreshLayers();refreshHistory();updateStatus();compDirty=true;requestRender();$('#docTitle').textContent=S.name;}

/* ---------- status / toast ---------- */
function updateStatus(){
  $('#stZoom').textContent=(S.zoom*100>=10?Math.round(S.zoom*100):(S.zoom*100).toFixed(1))+'%';
  $('#stSize').textContent=`${S.w} × ${S.h} px`;
  $('#stSel').textContent=S.sel?`選択 ${S.sel.w} × ${S.sel.h}`:'';
}
function updatePos(p){const x=Math.floor(p.x),y=Math.floor(p.y);$('#stPos').textContent=(x>=0&&y>=0&&x<S.w&&y<S.h)?`X ${x}  Y ${y}`:'';}
let toastT=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){
    if(e.key==='Escape'){e.preventDefault();modalHandlers&&modalHandlers.cancel();}
    else if(e.key==='Enter'&&!e.isComposing){e.preventDefault();modalHandlers&&modalHandlers.ok();}
    return;
  }
  if(e.key==='Escape'){closeMenus();if(drag)cancelDrag();}
  const t=e.target;if(t&&t.matches&&t.matches('input:not([type=range]):not([type=checkbox]),textarea,select'))return;
  if(polyDraft&&!e.ctrlKey&&!e.metaKey){
    if(e.key==='Enter'){e.preventDefault();closePoly();return;}
    if(e.key==='Escape'){e.preventDefault();cancelPoly();return;}
    if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();polyDraft.pts.pop();if(!polyDraft.pts.length)polyDraft=null;requestRender();return;}
  }
  if(e.key==='Shift'&&!pointer.shift){pointer.shift=true;if(polyDraft)requestRender();}
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();if(!spaceHeld){spaceHeld=true;updateCursor();requestRender();}return;}
  if(mod){
    if(k==='v'&&!e.shiftKey){pasteHandled=false;setTimeout(()=>{if(!pasteHandled&&clip)runCmd('paste');},120);return;}
    const map={x:'cut',c:e.shiftKey?'copy-merged':'copy',z:e.shiftKey?'redo':'undo',y:'redo',a:'select-all',d:'deselect','0':'fit','1':'actual','=':'zoom-in','+':'zoom-in',';':'zoom-in','-':'zoom-out',o:'open',s:'export-png',j:'layer-dup',e:'merge-down',i:e.shiftKey?'sel-invert':'f-invert'};
    const c=map[k];if(c){e.preventDefault();runCmd(c);}return;
  }
  if(e.altKey&&(e.key==='Backspace'||e.key==='Delete')){e.preventDefault();runCmd('fill-fg');return;}
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();runCmd('clear');return;}
  if(e.key==='['||e.key===']'){if(S.tool==='brush'||S.tool==='eraser'){const s=bset(),st=s.size<10?1:s.size<50?5:10;s.size=clamp(s.size+(e.key===']'?st:-st),1,400);syncOptions();requestRender();}return;}
  if(k==='x'){swapColors();return;}
  if(k==='d'){resetColors();return;}
  const tool=Object.keys(TOOLS).find(id=>TOOLS[id].key===k);
  if(tool){
    if(e.shiftKey&&tool==='marquee')setMarqShape(S.marq.shape==='rect'?'ellipse':'rect');
    if(e.shiftKey&&tool==='lasso')setLassoMode(S.lasso.mode==='free'?'poly':'free');
    selectTool(tool);
  }
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){spaceHeld=false;updateCursor();requestRender();}if(e.key==='Shift'){pointer.shift=false;if(polyDraft)requestRender();}});
view.addEventListener('dblclick',e=>{if(polyDraft&&S.tool==='lasso'){e.preventDefault();closePoly();}});
window.addEventListener('blur',()=>{spaceHeld=false;updateCursor();});

$('#panelToggle').addEventListener('click',()=>{const o=document.body.classList.toggle('panels-open');$('#panelToggle').setAttribute('aria-expanded',o);});

/* ---------- sample document ---------- */
function paintSample(c){
  const g=c.getContext('2d'),W=c.width,Hh=c.height,hz=Math.round(Hh*.62);
  let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#141b3d');gr.addColorStop(.45,'#4b3b78');gr.addColorStop(.8,'#c0607a');gr.addColorStop(1,'#f6a35c');
  g.fillStyle=gr;g.fillRect(0,0,W,hz);
  g.fillStyle='#fff';for(let i=0;i<140;i++){g.globalAlpha=.15+rnd()*.6;const s=rnd()<.9?1.2:2.2;g.fillRect(rnd()*W,rnd()*hz*.5,s,s);}g.globalAlpha=1;
  const sx=W*.66,sy=hz-34;
  let rg=g.createRadialGradient(sx,sy,0,sx,sy,340);rg.addColorStop(0,'rgba(255,214,140,.9)');rg.addColorStop(.22,'rgba(255,170,110,.38)');rg.addColorStop(1,'rgba(255,140,100,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,hz);g.fillStyle='#ffe6b0';g.beginPath();g.arc(sx,sy,44,0,Math.PI*2);g.fill();
  const ridge=(base,amp,fr,ph,col)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,hz);for(let x=0;x<=W;x+=4){const y=base-amp*(.55*Math.sin(x*fr+ph)+.3*Math.sin(x*fr*2.3+ph*1.7)+.15*Math.sin(x*fr*5.1+ph*.3));g.lineTo(x,y);}g.lineTo(W,hz);g.closePath();g.fill();};
  ridge(hz-78,70,.0055,1.2,'#7a5590');ridge(hz-36,56,.0085,3.1,'#4a3570');ridge(hz-8,28,.014,.4,'#2a2049');
  gr=g.createLinearGradient(0,hz,0,Hh);gr.addColorStop(0,'#6a4876');gr.addColorStop(.35,'#33284f');gr.addColorStop(1,'#0d0e20');g.fillStyle=gr;g.fillRect(0,hz,W,Hh-hz);
  for(let i=0;i<30;i++){const y=hz+5+i*i*.42,w=(96-i*2.6)*(.55+rnd()*.8);g.globalAlpha=Math.max(0,.8-i*.026);g.fillStyle=i<8?'#ffe0a6':'#f6a35c';g.fillRect(sx-w/2+(rnd()-.5)*16,y,Math.max(4,w),2+i*.1);}g.globalAlpha=1;
  g.fillStyle='#0a0916';g.beginPath();g.moveTo(0,Hh);g.lineTo(0,Hh*.8);for(let x=0;x<=W*.48;x+=4){const t=x/(W*.48);g.lineTo(x,Hh*.8+t*t*Hh*.2-18*Math.sin(t*9)*(1-t));}g.lineTo(W*.48,Hh);g.closePath();g.fill();
}
async function init(){
  buildMenus();buildTools();buildSwatches();setColor('fg','#ffe2a8');setColor('bg','#141b3d');
  S.w=1200;S.h=800;
  const bg=newLayer('背景');paintSample(bg.canvas);touch(bg);
  const tl=newLayer('タイトル');tl.blend='screen';
  S.layers=[bg,tl];S.active=1;
  try{await Promise.race([Promise.all([document.fonts.load('700 96px "IBM Plex Sans JP"','夕暮れ'),document.fonts.load('500 22px "IBM Plex Mono"','GOLDEN')]),new Promise(r=>setTimeout(r,1500))]);}catch(_){}
  const g=tl.canvas.getContext('2d');g.textBaseline='top';g.fillStyle='#ffe9c4';g.font='700 104px '+FONTS.sans;g.fillText('夕暮れ',72,68);
  g.font='500 22px '+FONTS.mono;g.fillStyle='rgba(255,233,196,.8)';g.fillText('GOLDEN HOUR  ·  35.36°N 138.73°E',78,196);touch(tl);
  const L=newLayer('レイヤー 1');S.layers.push(L);S.active=2;touch(L);layerNo=1;
  selectTool('brush');resetHistory('開く');
  new ResizeObserver(resizeView).observe(stage);resizeView();
  try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}catch(_){}
}
init();
